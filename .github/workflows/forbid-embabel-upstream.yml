name: Forbid embabel/guide push target

on:
  push:
  pull_request:

jobs:
  forbid-embabel-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require GitHub CLI (do not skip)
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "gh missing on runner; installing so the forbid job cannot skip" >&2
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "FORBIDDEN: gh still missing after install; refuse to skip" >&2
            exit 1
          fi
          gh --version
      - name: Cursor rule must stay alwaysApply
        run: |
          # Leftover #8: deleting the rule or dropping alwaysApply is CI-red,
          # not silent. Front matter only — a body mention must not keep this green.
          chmod +x scripts/forbid-embabel-upstream.sh
          test -f .cursor/rules/no-embabel-upstream.mdc
          awk 'BEGIN{p=0} /^---[[:space:]]*$/{p++; next} p==1{print}' \
            .cursor/rules/no-embabel-upstream.mdc \
            | grep -qE '^[[:space:]]*alwaysApply:[[:space:]]*true[[:space:]]*$'
      - name: Cloud-agent env notes must stay fork-local
        run: |
          # Leftover #6: do not treat as an Embabel contribution queue.
          # Deleting the notes or rewriting them as an Embabel PR path is CI-red.
          test -f docs/cloud-agent-env.md
          grep -qiE 'fork-local' docs/cloud-agent-env.md
          grep -qiE 'not.{0,40}(an )?Embabel contribution queue' docs/cloud-agent-env.md
          grep -qiE 'fork-only forever' docs/cloud-agent-env.md
      - name: Absorption doc is not a merge request
        run: |
          # Leftover #7: no leftover may ask to upstream.
          # Deleting the doc or rewriting it as an Embabel MR is CI-red.
          test -f docs/spdd-upstream-absorption.md
          grep -qiE 'not a merge request' docs/spdd-upstream-absorption.md
          grep -qiE 'No leftover may ask to upstream' docs/spdd-upstream-absorption.md
      - name: Clone without hook must still fail
        run: |
          # Leftover #9: CI does not install the pre-push hook.
          # A hook-less checkout must still fail --pre-push via the forbid script.
          chmod +x scripts/forbid-embabel-upstream.sh
          test -f scripts/forbid-embabel-upstream.sh
          test ! -e .git/hooks/pre-push
          if git config --get core.hooksPath >/dev/null 2>&1; then
            echo "CI checkout must not install core.hooksPath" >&2
            exit 1
          fi
          if ./scripts/forbid-embabel-upstream.sh --pre-push evil https://github.com/embabel/guide.git; then
            echo "expected forbid script to fail without the hook" >&2
            exit 1
          fi
      - name: Refuse embabel/guide as a push destination
        run: |
          chmod +x scripts/forbid-embabel-upstream.sh scripts/forbid-embabel-upstream-assert.sh
          # Leftover #4: --pre-push to embabel/guide.git must fail.
          # Leftover #8: missing rule / dropped alwaysApply is proven inside
          # the assert (job stays red).
          # Leftover #6: Cloud-agent env notes must stay fork-local; treating
          # them as an Embabel contribution queue keeps this job red.
          # Leftover #7: absorption doc is not a merge request; a leftover
          # that asks to upstream keeps this job red.
          # Leftover #9: hook install must keep the forbid script; a clone
          # without the hook still fails here (job stays red).
          ./scripts/forbid-embabel-upstream-assert.sh
